<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRA - Ovozli Yordamchi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            max-width: 400px;
            padding: 20px;
        }

        /* Yoqimli maxluqcha (Avatar) dizayni */
        .creature-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .creature {
            width: 130px;
            height: 130px;
            background: #ffffff;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 3s ease-in-out infinite;
            transition: all 0.4s ease;
        }

        /* Antennasi */
        .creature::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 20px;
            background: #ffffff;
        }

        .creature::after {
            content: '';
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: glow 1.5s infinite alternate;
        }

        /* Yuz qismi (Ko'zlar va Og'iz) */
        .face {
            width: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .eye {
            width: 16px;
            height: 22px;
            background: #0b0f19;
            border-radius: 50%;
            animation: blink 4s infinite;
        }

        .mouth {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 7px;
            border: 3px solid #0b0f19;
            border-top: none;
            border-radius: 0 0 15px 15px;
        }

        /* Tinglash rejimidagi o'zgarishlar */
        .listening .creature {
            background: #38bdf8;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.6);
            transform: scale(1.1);
        }

        .listening .creature::after {
            background: #ffffff;
            box-shadow: 0 0 15px #ffffff;
        }

        .listening .eye {
            background: #ffffff;
            height: 18px; /* Xursand ko'zcha */
            border-radius: 10px 10px 0 0;
        }

        .listening .mouth {
            width: 20px;
            height: 10px;
            border: 3px solid #ffffff;
            border-top: none;
            border-radius: 0 0 20px 20px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        @keyframes glow {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        h1 {
            font-size: 24px;
            letter-spacing: 3px;
            color: #ffffff;
        }

        #status {
            font-size: 14px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 50px;
            width: 100%;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #ffffff;
            color: #0b0f19;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }

        button:hover {
            background: #38bdf8;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container" id="aira-container">
        <h1>AIRA AI</h1>
        
        <!-- Maxluqcha avatari -->
        <div class="creature-container">
            <div class="creature">
                <div class="face">
                    <div class="eye"></div>
                    <div class="eye"></div>
                    <div class="mouth"></div>
                </div>
            </div>
        </div>

        <p id="status">Tugmani bosing va "Aira" deb gapiring...</p>
        <button id="start-btn">AIRA-ni Yoqish</button>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');
        const container = document.getElementById('aira-container');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "Xatolik: Brauzeringiz ovozni tanishni qo'llab-quvvatlamaydi.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'uz-UZ'; 
            recognition.continuous = true;
            recognition.interimResults = true;

            let isListening = false;

            startBtn.addEventListener('click', () => {
                try {
                    if (!isListening) {
                        recognition.start();
                        isListening = true;
                        startBtn.innerText = "O'chirish";
                        statusText.innerText = "Quloq solyapman, 'Aira' deng...";
                        speak("Tinglayapman.");
                    } else {
                        recognition.stop();
                        isListening = false;
                        startBtn.innerText = "AIRA-ni Yoqish";
                        statusText.innerText = "To'xtatildi.";
                    }
                } catch (e) {
                    statusText.innerText = "Xatolik: " + e.message;
                }
            });

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                
                transcript = transcript.trim().toLowerCase();
                statusText.innerText = `Eshitildi: "${transcript}"`;

                if (transcript.includes('aira')) {
                    container.classList.add('listening');
                    speak("Buyruq bajarilmoqda.");

                    if (transcript.includes('youtube')) {
                        statusText.innerText = "YouTube ochilmoqda...";
                        setTimeout(() => window.open('https://www.youtube.com', '_blank'), 1000);
                    } 
                    else if (transcript.includes('instagram')) {
                        statusText.innerText = "Instagram ochilmoqda...";
                        setTimeout(() => window.open('https://www.instagram.com', '_blank'), 1000);
                    } 
                    else if (transcript.includes('telegram')) {
                        statusText.innerText = "Telegram ochilmoqda...";
                        setTimeout(() => window.open('https://web.telegram.org', '_blank'), 1000);
                    } 
                    else if (transcript.includes('google') || transcript.includes('qidir')) {
                        let query = transcript.replace('aira', '').replace('google', '').replace('qidir', '').trim();
                        statusText.innerText = `Qidirilmoqda: ${query}`;
                        setTimeout(() => window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank'), 1000);
                    }

                    setTimeout(() => {
                        container.classList.remove('listening');
                    }, 3000);
                }
            };

            recognition.onerror = (event) => {
                statusText.innerText = "Mikrofon xatosi: " + event.error;
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch (e) {}
                }
            };
        }

        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'uz-UZ';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
