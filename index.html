<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRA - AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            max-width: 420px;
            padding: 20px;
        }

        .ai-avatar-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ai-sphere {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #888888, #111111);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.15),
                        inset 0 0 25px rgba(255, 255, 255, 0.5);
            animation: breathe 4s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ai-core {
            width: 50px;
            height: 50px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px #ffffff, 0 0 40px #38bdf8;
            animation: pulse-core 2s ease-in-out infinite alternate;
        }

        .orbit-ring {
            position: absolute;
            width: 160px;
            height: 160px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }

        .orbit-ring::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            width: 7px;
            height: 7px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
        }

        .listening .ai-sphere {
            background: radial-gradient(circle at 30% 30%, #ffffff, #38bdf8, #0284c7);
            box-shadow: 0 0 70px rgba(56, 189, 248, 0.6),
                        inset 0 0 35px rgba(255, 255, 255, 0.8);
            animation: listen-pulse 1s ease-in-out infinite alternate;
        }

        .listening .ai-core {
            background: #ffffff;
            box-shadow: 0 0 35px #ffffff, 0 0 70px #ec4899;
            transform: scale(1.2);
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes pulse-core {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes listen-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 22px;
            letter-spacing: 3px;
            color: #ffffff;
            font-weight: 600;
        }

        #status {
            font-size: 13px;
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            min-height: 50px;
            max-height: 90px;
            overflow-y: auto;
        }

        button {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #ffffff;
            color: #050505;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        button:hover {
            background: #38bdf8;
            color: #ffffff;
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container" id="aira-container">
        <h1>AIRA AI</h1>
        
        <div class="ai-avatar-wrapper">
            <div class="orbit-ring"></div>
            <div class="ai-sphere">
                <div class="ai-core"></div>
            </div>
        </div>

        <p id="status">Tugmani bosing va o'zbek, rus yoki ingliz tilida gapiring...</p>
        <button id="start-btn">AIRA-ni Yoqish</button>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');
        const container = document.getElementById('aira-container');

        // Siz taqdim etgan Gemini API kaliti ulandi
        const GEMINI_API_KEY = "AQ.Ab8RN6JsE7MyzhzmTzwnkAQOcZKu0DBMBWpkPQ7j2CHK-sW1AA";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "Xatolik: Brauzeringiz ovozni tanishni qo'llab-quvvatlamaydi.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'uz-UZ'; 
            recognition.continuous = true;
            recognition.interimResults = true;

            let isListening = false;
            let isSpeaking = false;

            startBtn.addEventListener('click', () => {
                try {
                    if (!isListening) {
                        recognition.start();
                        isListening = true;
                        startBtn.innerText = "O'chirish";
                        statusText.innerText = "Listening... Говорите... Gapiring...";
                        speak("Aira is online. Eshitayapman.");
                    } else {
                        recognition.stop();
                        isListening = false;
                        startBtn.innerText = "AIRA-ni Yoqish";
                        statusText.innerText = "To'xtatildi.";
                    }
                } catch (e) {
                    statusText.innerText = "Xatolik: " + e.message;
                }
            });

            recognition.onresult = async (event) => {
                if (isSpeaking) return;

                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                
                transcript = transcript.trim().toLowerCase();
                statusText.innerText = `Eshitildi: "${transcript}"`;

                if (transcript.includes('aira') || transcript.includes('айра') || 
                    transcript.includes('open') || transcript.includes('kir') || 
                    transcript.includes('открой') || transcript.includes('qidir') || 
                    transcript.includes('search') || transcript.includes('найди') ||
                    transcript.includes('ob-havo') || transcript.includes('погода') || transcript.includes('weather') ||
                    transcript.length > 5) {
                    
                    container.classList.add('listening');

                    // 1. TELEGRAM
                    if (transcript.includes('telegram') || transcript.includes('телеграм')) {
                        statusText.innerText = "Telegram ochilmoqda...";
                        speak("Telegram ochilmoqda.");
                        setTimeout(() => window.location.href = 'tg://', 1000);
                    } 
                    // 2. INSTAGRAM
                    else if (transcript.includes('instagram') || transcript.includes('инстаграм')) {
                        statusText.innerText = "Instagram ochilmoqda...";
                        speak("Instagram ochilmoqda.");
                        setTimeout(() => window.location.href = 'instagram://', 1000);
                    } 
                    // 3. GALEREYA
                    else if (transcript.includes('gallery') || transcript.includes('galareya') || transcript.includes('галерея')) {
                        statusText.innerText = "Galereya ochilmoqda...";
                        speak("Galereya ochilmoqda.");
                        setTimeout(() => {
                            window.location.href = 'content://media/internal/images/media';
                        }, 1000);
                    }
                    // 4. GOOGLE QIDIRUV
                    else if (transcript.includes('google') || transcript.includes('гугл')) {
                        let query = transcript.replace('aira', '').replace('айра', '').replace('google', '').replace('гугл', '').replace('kir', '').replace('открой', '').replace('qidir', '').replace('search', '').replace('найди', '').trim();
                        
                        statusText.innerText = `Google'da qidirilmoqda: ${query}`;
                        speak(`Google'da ${query} qidirilmoqda.`);
                        
                        setTimeout(() => {
                            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                        }, 1000);
                    }
                    // 5. YOUTUBE
                    else if (transcript.includes('youtube') || transcript.includes('ютуб')) {
                        let query = transcript.replace('aira', '').replace('айра', '').replace('youtube', '').replace('ютуб', '').replace('qidir', '').replace('search', '').replace('найди', '').trim();
                        
                        statusText.innerText = `YouTube ochilmoqda: ${query}`;
                        speak("YouTube ochilmoqda.");
                        
                        setTimeout(() => {
                            if (query.length > 2) {
                                window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');
                            } else {
                                window.open('https://www.youtube.com', '_blank');
                            }
                        }, 1000);
                    }
                    // 6. GEMINI ORQALI SAVOLLAR VA OB-HAVO
                    else {
                        statusText.innerText = "O'ylayapman (Gemini)...";
                        
                        let aiAnswer = await askGemini(transcript);
                        statusText.innerText = aiAnswer;
                        speak(aiAnswer);
                    }

                    setTimeout(() => {
                        container.classList.remove('listening');
                    }, 4000);
                }
            };

            recognition.onerror = (event) => {
                statusText.innerText = "Mikrofon xatosi: " + event.error;
            };

            recognition.onend = () => {
                if (isListening && !isSpeaking) {
                    try { recognition.start(); } catch (e) {}
                }
            };

            // Gemini AI bilan bog'lanish funksiyasi
            async function askGemini(promptText) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `Siz AIRA nomli aqlli ovozli yordamchisiz. Foydalanuvchi Samarqand shahrida turadi. Berilgan savolga qaysi tilda (o'zbek, rus yoki ingliz) yozilgan bo'lsa, o'sha tilda qisqacha, aniq va ovozli o'qishga moslab javob bering: ${promptText}`
                                }]
                            }]
                        })
                    });

                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        return data.candidates[0].content.parts[0].text.trim();
                    } else {
                        return "Kechirasiz, javob olishda xatolik yuz berdi.";
                    }
                } catch (error) {
                    return "Internetga ulanishda xatolik kuzatildi.";
                }
            }

            window.speak = function(text) {
                isSpeaking = true;
                const speech = new SpeechSynthesisUtterance(text);
                
                if (/[а-яА-ЯЁё]/.test(text)) {
                    speech.lang = 'ru-RU';
                } else if (/[a-zA-Z]/.test(text)) {
                    speech.lang = 'en-US';
                } else {
                    speech.lang = 'uz-UZ';
                }
                
                speech.onend = function() {
                    isSpeaking = false;
                };

                window.speechSynthesis.speak(speech);
            }
        }
    </script>
</body>
</html>
