<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRA - AI Yordamchi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 400px;
            padding: 20px;
        }

        /* Meta AI uslubidagi futuristik sfera avatari */
        .ai-avatar-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ai-sphere {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #888888, #111111);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.15),
                        inset 0 0 30px rgba(255, 255, 255, 0.5);
            animation: breathe 4s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ichki jonli yadro (Core) */
        .ai-core {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 25px #ffffff, 0 0 50px #38bdf8;
            animation: pulse-core 2s ease-in-out infinite alternate;
        }

        /* Atrofdagi neon halqalar */
        .orbit-ring {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }

        .orbit-ring::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
        }

        /* Tinglash rejimidagi (Aktiv) holat */
        .listening .ai-sphere {
            background: radial-gradient(circle at 30% 30%, #ffffff, #38bdf8, #0284c7);
            box-shadow: 0 0 80px rgba(56, 189, 248, 0.6),
                        inset 0 0 40px rgba(255, 255, 255, 0.8);
            animation: listen-pulse 1s ease-in-out infinite alternate;
        }

        .listening .ai-core {
            background: #ffffff;
            box-shadow: 0 0 40px #ffffff, 0 0 80px #ec4899;
            transform: scale(1.2);
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes pulse-core {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes listen-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 24px;
            letter-spacing: 4px;
            color: #ffffff;
            font-weight: 600;
        }

        #status {
            font-size: 14px;
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            min-height: 48px;
        }

        button {
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #ffffff;
            color: #050505;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        button:hover {
            background: #38bdf8;
            color: #ffffff;
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container" id="aira-container">
        <h1>AIRA AI</h1>
        
        <!-- Meta AI uslubidagi futuristik sfera avatari -->
        <div class="ai-avatar-wrapper">
            <div class="orbit-ring"></div>
            <div class="ai-sphere">
                <div class="ai-core"></div>
            </div>
        </div>

        <p id="status">Tugmani bosing va "Aira" deb gapiring...</p>
        <button id="start-btn">AIRA-ni Yoqish</button>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');
        const container = document.getElementById('aira-container');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "Xatolik: Brauzeringiz ovozni tanishni qo'llab-quvvatlamaydi.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'uz-UZ'; 
            recognition.continuous = true;
            recognition.interimResults = true;

            let isListening = false;

            startBtn.addEventListener('click', () => {
                try {
                    if (!isListening) {
                        recognition.start();
                        isListening = true;
                        startBtn.innerText = "O'chirish";
                        statusText.innerText = "Tinglayapman, 'Aira' deb murojaat qiling...";
                        speak("Aira faollashdi.");
                    } else {
                        recognition.stop();
                        isListening = false;
                        startBtn.innerText = "AIRA-ni Yoqish";
                        statusText.innerText = "To'xtatildi.";
                    }
                } catch (e) {
                    statusText.innerText = "Xatolik: " + e.message;
                }
            });

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                
                transcript = transcript.trim().toLowerCase();
                statusText.innerText = `Eshitildi: "${transcript}"`;

                if (transcript.includes('aira')) {
                    container.classList.add('listening');
                    speak("Bajarilmoqda.");

                    if (transcript.includes('youtube')) {
                        statusText.innerText = "YouTube ochilmoqda...";
                        setTimeout(() => window.open('https://www.youtube.com', '_blank'), 1000);
                    } 
                    else if (transcript.includes('instagram')) {
                        statusText.innerText = "Instagram ochilmoqda...";
                        setTimeout(() => window.open('https://www.instagram.com', '_blank'), 1000);
                    } 
                    else if (transcript.includes('telegram')) {
                        statusText.innerText = "Telegram ochilmoqda...";
                        setTimeout(() => window.open('https://web.telegram.org', '_blank'), 1000);
                    } 
                    else if (transcript.includes('google') || transcript.includes('qidir')) {
                        let query = transcript.replace('aira', '').replace('google', '').replace('qidir', '').trim();
                        statusText.innerText = `Qidirilmoqda: ${query}`;
                        setTimeout(() => window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank'), 1000);
                    }

                    setTimeout(() => {
                        container.classList.remove('listening');
                    }, 3000);
                }
            };

            recognition.onerror = (event) => {
                statusText.innerText = "Mikrofon xatosi: " + event.error;
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch (e) {}
                }
            };
        }

        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'uz-UZ';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
